
name: Test Build Dreame Beauty

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Build website
        run: bun run build

      - name: Inspect build output
        if: success()
        run: |
          echo "Build completed"
          find .output -maxdepth 3 -type d 2>/dev/null || true
          if [ -f .output/public/index.html ]; then
            echo "STATIC INDEX FOUND"
          else
            echo "STATIC INDEX NOT FOUND"
          fi
